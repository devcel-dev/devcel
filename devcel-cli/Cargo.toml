[package]
name = "devcel-cli"
edition.workspace = true
license = "MIT"
description = "CLI for Devcel projects, automation, and headless servers"

[[bin]]
name = "devcel"
path = "src/main.rs"

[dependencies]
devcel-core = { path = "../devcel-core", features = ["p2p", "localization"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true }

sha2 = "0.10"
