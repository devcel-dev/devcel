<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devcel Import settings</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;margin:0;background:#17211f;color:#edf4f1}main{max-width:960px;margin:auto;padding:28px}h1{margin:0;font-size:25px}.sub{color:#afc5bc}button,input,select{font:inherit;border:1px solid #516a60;border-radius:6px;padding:8px;background:#22372e;color:inherit}button{cursor:pointer}button:hover{background:#3d5e4d}button:disabled{opacity:.45;cursor:wait}.primary{background:#b3e4c8;color:#17211f;font-weight:700}fieldset{border:1px solid #4c675c;border-radius:10px;padding:20px;margin:20px 0}label{display:block;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{box-sizing:border-box;width:100%}.file{display:flex;gap:8px}.file input{flex:1;min-width:0}.file button{white-space:nowrap}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.result,pre{white-space:pre-wrap;word-break:break-word;background:#101916;border:1px solid #4c675c;border-radius:8px;padding:15px;min-height:56px}pre{min-height:0;font:13px/1.5 monospace}details{margin:12px 0}summary{cursor:pointer;color:#afc5bc}.warning{color:#f1d493;font-size:13px}.error{color:#ffb4b4}small{color:#afc5bc}#root{overflow-wrap:anywhere}input[type=file]{display:none}
</style></head><body><main><h1>Devcel Import settings</h1><p id="root"></p>
<div class="toolbar"><button id="add">Add configuration</button><button id="save" class="primary">Save settings</button><button id="all">Reimport all</button><button id="status">Check saved status</button></div><div id="sources"></div><p id="dirty" class="warning"></p><div id="result" class="result" role="status" aria-live="polite">Starting…</div><details id="details" hidden><summary>Technical details (JSON)</summary><pre id="detail-json"></pre></details><input type="file" id="picker" accept=".toml"><script src="tag-filters.js"></script><script src="importer-ui.js"></script></main></body></html>
