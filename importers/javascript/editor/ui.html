<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Devcel Import</title>
<style>body{font:15px system-ui;background:#17212b;color:#edf4fa;max-width:960px;margin:32px auto;padding:20px}button,input,select{font:inherit;padding:8px;border:1px solid #54718a;border-radius:5px}button{cursor:pointer;margin:5px;background:#b8e4c8}input,select{background:#253747;color:inherit;width:95%;box-sizing:border-box}label{display:block;margin:10px 0}section{border:1px solid #54718a;border-radius:8px;padding:20px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#b9c9d8}button:disabled{opacity:.5}</style>
<h1>Devcel Import</h1><p id="location"></p>
<div id="sources"></div><button id="add">Add source</button><button id="save">Save settings</button><button id="all">Reimport all</button><button id="status">Check status</button><label><input id="watch" type="checkbox" style="width:auto"> Watch saved changes and import automatically</label><p id="result" role="status" style="white-space:pre-wrap"></p><details id="details" hidden><summary>Details (JSON)</summary><pre id="raw"></pre></details>
<script src="/tag-filters.js"></script>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');let config={schema_version:1,sources:[]},revision='missing',busy=false;let tagWidgets=[];
const out=document.querySelector('#result'),details=document.querySelector('#details'),raw=document.querySelector('#raw');
function errorText(value){if(typeof value==='string')return value;return value?.text??value?.message??(value?.error?errorText(value.error):'Open the details to investigate the cause.');}
function summarize(value){
  if(typeof value==='string')return value;
  const data=value?.result??value,sources=data?.data?.sources??data?.sources;
  if(Array.isArray(sources))return sources.map(source=>`${source.id}: ${{pulled:'Import completed',ready:'Up to date',needs_pull:'Reimport required',error:'Import failed'}[source.status]??'Check the status'}${source.error?'\n  '+errorText(source.error):''}`).join('\n');
  if(data?.config)return `Saved settings (${data.config.sources.length} sources)`;
  if(typeof data?.watching==='boolean')return data.watching?'Started watching saved changes.':'Stopped watching saved changes.';
  return data?.ok===false?'Operation failed.\n'+errorText(data.error):'Operation completed.';
}
function showResult(value,failed=false){
  out.textContent=failed?(value?.data?.sources||value?.sources?summarize(value):'Operation failed.\n'+errorText(value)):summarize(value);
  details.open=false;details.hidden=typeof value==='string'&&!failed;raw.textContent=JSON.stringify(value,null,2);
}
async function request(action,data={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Devcel-Token':token},body:JSON.stringify({action,...data})});const json=await r.json();if(!r.ok){const error=new Error(json.error);try{error.details=JSON.parse(json.error);}catch{error.details=json;}throw error;}return json;}
async function work(fn,progress='Working…'){
  if(busy)return;busy=true;out.textContent=progress;out.setAttribute('aria-busy','true');details.hidden=true;details.open=false;
  document.querySelectorAll('button,input,select').forEach(b=>b.disabled=true);
  try{showResult(await fn());}catch(e){showResult(e.details??{error:e.message},true);}
  finally{busy=false;out.setAttribute('aria-busy','false');document.querySelectorAll('button,input,select').forEach(b=>b.disabled=false);}
}
const fields=[['id','Configuration ID'],['project','Source project'],['namespace','Namespace'],['class_name','Class name'],['version','Content Version'],['runtime_out','JSON output path'],['code_out','TypeScript output path']];
function render(){tagWidgets.forEach(widget=>widget.dispose());tagWidgets=[];const list=document.querySelector('#sources');list.replaceChildren();config.sources.forEach((s,index)=>{const section=document.createElement('section');const title=document.createElement('h2');title.textContent=s.id||'New source';section.append(title);const grid=document.createElement('div');grid.className='grid';let projectInput;for(const [key,label]of fields){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.value=s[key]??'';input.dataset.key=key;if(key==='project')projectInput=input;const hints={class_name:'Leave blank to use the default class name',version:'Leave blank for all versions',code_out:'Leave blank to disable code generation'};input.placeholder=hints[key]??'';input.title=key==='version'?'Leave blank for all versions. Valid range: 0–4294967295.':input.placeholder;input.oninput=()=>{if(key==='version'){if(input.value==='')delete s.version;else s.version=Number(input.value);}else if((key==='class_name'||key==='code_out')&&!input.value)delete s[key];else s[key]=input.value;if(key==='code_out'){if(input.value)s.code_target='typescript';else delete s.code_target;}};l.append(input);grid.append(l);}const mode=document.createElement('label');mode.textContent='Export mode';const select=document.createElement('select');for(const v of ['full','minimal']){const o=document.createElement('option');o.value=v;o.textContent=v==='full'?'Full':'Omit defaults (minimal)';select.append(o);}select.value=s.mode??'full';select.onchange=()=>s.mode=select.value;mode.append(select);grid.append(mode);section.append(grid);const filters=document.createElement('div');section.append(filters);const widget=DevcelTagFilters.create(filters,s,async project=>(await request('tags',{project})).presets,()=>{},()=>busy);tagWidgets.push(widget);projectInput.addEventListener('input',()=>widget.update(''));projectInput.addEventListener('change',()=>widget.update(s.project));widget.update(s.project);const reimport=document.createElement('button');reimport.textContent='Reimport this source';reimport.onclick=()=>work(async()=>{await save();return request('import',{sourceId:s.id});},`${s.id}: Importing…`);section.append(reimport);const remove=document.createElement('button');remove.textContent='Remove from settings (keep generated files)';remove.onclick=()=>{config.sources.splice(index,1);render();};section.append(remove);list.append(section);});if(busy)list.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);}
document.querySelector('#add').onclick=()=>{const n=config.sources.length+1;config.sources.push({id:'source'+n,project:'../Authoring/Game.devcelproj.toml',namespace:'Game.Source'+n,class_name:'GameData'+n,runtime_out:'data/source'+n+'.json',code_out:'generated/source'+n+'/GameData.ts',code_target:'typescript',mode:'full'});render();};
async function save(){const data=await request('save',{config,revision});config=data.config;revision=data.revision;render();return data;}
document.querySelector('#save').onclick=()=>work(save,'Saving settings…');document.querySelector('#all').onclick=()=>work(async()=>{await save();return request('import');},'Importing all sources…');document.querySelector('#status').onclick=()=>work(()=>request('status'),'Checking source status…');document.querySelector('#watch').onchange=e=>work(()=>request('watch',{enabled:e.target.checked}));
work(async()=>{const data=await request('config');config=data.config;revision=data.revision;document.querySelector('#location').textContent=data.path;render();return 'Select a configuration and reimport.';});
</script></html>
