[package]
name = "devcel-studio"
description = "Desktop editor for structured table data and game master data"
edition = "2021"
license = "GPL-3.0"

[[bin]]
name = "devcel-studio"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devcel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
notify = "=8.2.0"
sys-locale = "=0.3.2"
tempfile = "3"
same-file = "=1.0.6"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-fs = "2.7.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
sha2 = "0.10"
semver = "1"
url = "2"
base64 = "0.22"
minisign-verify = "0.2"
tauri-plugin-process = "2.4.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.7"
uuid = { version = "1.7.0", features = ["v4"] }
libc = "0.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-updater = "2.13.3"
devcel-core = { path = "../../devcel-core", features = ["p2p", "localization"] }
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
rayon = "1.10"

[features]
default = ["p2p"]
p2p = ["devcel-core/p2p"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
toml08 = { package = "toml", version = "0.8.2" }
