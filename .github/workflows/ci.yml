name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  # Cache complete release artifacts; incremental compilation stays disabled.
  CARGO_INCREMENTAL: '0'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # Share dependency artifacts with the isolated MIT importer source build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          # Candidate artifacts must use the same source revision as mobile.
          # Ordinary PR builds keep GitHub's prospective merge revision.
          ref: ${{ (contains(github.event.pull_request.labels.*.name, 'release-candidate') && github.event.pull_request.head.sha) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: devcel-studio/package.json
          cache: npm
          cache-dependency-path: devcel-studio/package-lock.json
      - name: Install pinned toolchains
        run: |
          python scripts/ci-release.py toolchains
      - name: Restore Rust release cache
        id: rust-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release
            target/*/release
            !target/release/bundle
            !target/release/incremental
            !target/*/release/bundle
            !target/*/release/incremental
          key: rust-release-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}-${{ env.RUSTFLAGS }}-${{ github.sha }}
          restore-keys: |
            rust-release-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}-${{ env.RUSTFLAGS }}-
      - name: Prepare Linux download cache
        if: runner.os == 'Linux'
        id: apt-plan
        run: |
          sudo apt-get update
          python scripts/ci-apt-cache.py plan
      - name: Restore Linux package downloads
        if: runner.os == 'Linux' && steps.apt-plan.outputs.key != ''
        id: apt-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ runner.temp }}/devcel-apt-cache/*.deb
          key: apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-apt-cache.py') }}-${{ steps.apt-plan.outputs.key }}
          restore-keys: |
            apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-apt-cache.py') }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        id: apt-install
        env:
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: python scripts/ci-apt-cache.py install
      - name: Save Linux package downloads
        if: runner.os == 'Linux' && steps.apt-install.outputs.save == 'true' && steps.apt-plan.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/devcel-apt-cache/*.deb
          key: apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-apt-cache.py') }}-${{ steps.apt-plan.outputs.key }}
      - run: npm ci --prefix devcel-studio
      - name: Build native distribution
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'release-candidate')
        run: python scripts/ci-release.py build_native
      - name: Prepare release candidate identity
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-candidate')
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          python -c "import os,sys; sys.path.insert(0,'scripts'); from product_version import read_version; from pathlib import Path; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('RELEASE_TAG=v'+read_version(Path.cwd())+'\n'); f.write('SOURCE_COMMIT='+os.environ['SOURCE_COMMIT']+'\n'); f.write('SOURCE_REPOSITORY='+os.environ['SOURCE_REPOSITORY']+'\n')"
      - name: Build release candidate artifacts
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-candidate')
        run: python scripts/ci-release.py package
      - name: Retain release candidate artifacts
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-candidate')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}${{ runner.os == 'macOS' && format('-{0}', runner.arch) || '' }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove generated packages before caching
        if: ${{ !cancelled() }}
        run: python scripts/ci-release.py clean_native_outputs
      - name: Save Rust release cache
        # Preserve completed compilation even if later packaging fails.
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release
            target/*/release
            !target/release/bundle
            !target/release/incremental
            !target/*/release/bundle
            !target/*/release/incremental
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
